<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a23">
  <meta name="description" content="文明を育て、技術を解き明かすインクリメンタルゲーム。">
  <title>文明の種 v0.6.0 | Incremental Civilization</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=0.6.0">
  <style>
    /* Toolbox integration only: no iframe; leave the game's touch area intact. */
    .toolbox-home {position:fixed;z-index:400;right:10px;bottom:calc(91px + env(safe-area-inset-bottom));background:#163039f2;color:#fff;border:1px solid #8bb6b0b0;border-radius:13px;text-decoration:none;padding:10px 13px;font:700 12px/1.4 -apple-system,system-ui,sans-serif;box-shadow:0 3px 14px #0006;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .toolbox-home:focus-visible {outline:2px solid #eed9a5;outline-offset:2px}
    @media(max-height:480px){.toolbox-home{bottom:calc(67px + env(safe-area-inset-bottom))}}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">✦</div>
        <div class="brand-text"><strong>文明の種</strong><span>INCREMENTAL CIVILIZATION</span></div>
      </div>
      <div class="header-right"><span id="era-pill" class="era-pill">石器時代</span><button class="icon-btn" data-action="settings" title="設定とセーブ" aria-label="設定とセーブ">⚙</button></div>
    </header>
    <section class="resource-bar" id="resources" aria-live="off"></section>
    <main id="main" class="main-content" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="ゲームの画面">
      <button class="nav-btn active" data-tab="home"><span class="nav-glyph">⌂</span><span>集落</span></button>
      <button class="nav-btn" data-tab="people"><span class="nav-glyph">♙</span><span>住民</span></button>
      <button class="nav-btn" data-tab="buildings"><span class="nav-glyph">▤</span><span>施設</span></button>
      <button class="nav-btn" data-tab="research"><span class="nav-glyph">✧</span><span>研究</span></button>
      <button class="nav-btn" data-tab="history"><span class="nav-glyph">▣</span><span>記録</span></button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
  </div>
  <a href="../../" class="toolbox-home" id="toolbox-home" aria-label="My Toolboxのホームに戻る">← ホームへ戻る</a>
  <script src="game.js?v=0.6.0-toolbox-1.1.4" defer></script>
</body>
</html>
